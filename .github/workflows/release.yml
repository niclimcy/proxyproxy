name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none rebuilds the version in Cargo.toml)"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Bump Cargo.toml, commit and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          BRANCH: ${{ github.ref_name }}
        run: |
          CURRENT=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            none) VERSION="$CURRENT" ;;
          esac
          TAG="v$VERSION"
          tag_exists() { git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$VERSION" != "$CURRENT" ]; then
            if tag_exists; then
              echo "::error::$TAG already exists"
              exit 1
            fi
            sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
            perl -0pi -e "s/(name = \"proxyproxy\"\nversion = \")[^\"]+/\${1}$VERSION/" Cargo.lock
            git commit -am "chore: bump version to $VERSION"
            git push origin "HEAD:$BRANCH"
          fi

          # With bump=none an existing tag is rebuilt as is.
          if ! tag_exists; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $CURRENT -> $VERSION ($TAG)" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows (x86_64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable

      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/proxyproxy.exe -DestinationPath dist/proxyproxy-windows-x86_64.zip

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-x86_64
          path: dist/proxyproxy-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS (universal)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable

      - name: Install Rust targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build Intel and Apple Silicon
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin

      - name: Create app bundle
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist/ProxyProxy.app/Contents/{MacOS,Resources}
          lipo -create \
            target/x86_64-apple-darwin/release/proxyproxy \
            target/aarch64-apple-darwin/release/proxyproxy \
            -output dist/ProxyProxy.app/Contents/MacOS/proxyproxy

          cat > dist/ProxyProxy.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>proxyproxy</string>
            <key>CFBundleDisplayName</key><string>proxyproxy</string>
            <key>CFBundleIdentifier</key><string>com.niclim.proxyproxy</string>
            <key>CFBundleExecutable</key><string>proxyproxy</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.0</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/0\\.0\\.0/${VERSION}/" dist/ProxyProxy.app/Contents/Info.plist

          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icon.png --out "icon.iconset/icon_${size}x${size}.png" >/dev/null
          done
          cp icon.iconset/icon_32x32.png icon.iconset/icon_16x16@2x.png
          cp icon.iconset/icon_256x256.png icon.iconset/icon_128x128@2x.png
          cp icon.iconset/icon_512x512.png icon.iconset/icon_256x256@2x.png
          sips -z 1024 1024 assets/icon.png --out icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns icon.iconset -o dist/ProxyProxy.app/Contents/Resources/icon.icns

          chmod +x dist/ProxyProxy.app/Contents/MacOS/proxyproxy
          ditto -c -k --sequesterRsrc --keepParent dist/ProxyProxy.app dist/proxyproxy-macos-universal.zip

          python3 -m venv .dmgbuild-venv
          .dmgbuild-venv/bin/python -m pip install dmgbuild pillow

          # qlmanage pads to a square with the SVG top-left, and only at the size asked;
          # a 1x PNG gets upscaled on Retina, so build a 1x+2x multi-resolution TIFF.
          DMG_BG_DIR="$(mktemp -d)"
          for scale in 1 2; do
            mkdir "$DMG_BG_DIR/$scale"
            qlmanage -t -s $((600 * scale)) -o "$DMG_BG_DIR/$scale" assets/dmg-background.svg >/dev/null
            .dmgbuild-venv/bin/python - "$DMG_BG_DIR" "$scale" <<'PY'
          import glob, sys
          from PIL import Image
          d, scale = sys.argv[1], int(sys.argv[2])
          src = glob.glob(f"{d}/{scale}/*.png")[0]
          name = "bg.png" if scale == 1 else "bg@2x.png"
          Image.open(src).convert("RGB").crop((0, 0, 600 * scale, 400 * scale)).save(
              f"{d}/{name}", dpi=(72 * scale, 72 * scale)
          )
          PY
          done
          DMG_BACKGROUND="$DMG_BG_DIR/background.tiff"
          tiffutil -cathidpicheck "$DMG_BG_DIR/bg.png" "$DMG_BG_DIR/bg@2x.png" -out "$DMG_BACKGROUND"

          cat > "$DMG_BG_DIR/dmgbuild.py" <<'PY'
          import os.path


          application = defines.get("app")
          appname = os.path.basename(application)

          format = "UDZO"
          files = [application]
          symlinks = {"Applications": "/Applications"}

          icon_locations = {
              appname: (140, 220),
              "Applications": (460, 220),
          }

          background = defines.get("background")
          show_status_bar = False
          show_tab_view = False
          show_toolbar = False
          show_pathbar = False
          show_sidebar = False

          window_rect = ((100, 100), (600, 400))
          default_view = "icon-view"
          arrange_by = None
          grid_offset = (0, 0)
          grid_spacing = 100
          icon_size = 128
          PY

          .dmgbuild-venv/bin/dmgbuild \
            -s "$DMG_BG_DIR/dmgbuild.py" \
            -D app="$PWD/dist/ProxyProxy.app" \
            -D background="$DMG_BACKGROUND" \
            "proxyproxy" \
            dist/proxyproxy-macos-universal.dmg

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-universal
          path: |
            dist/proxyproxy-macos-universal.zip
            dist/proxyproxy-macos-universal.dmg
          if-no-files-found: error

  linux:
    name: Linux distributions
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config dpkg-dev rpm fakeroot \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable

      - name: Install Rust target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Build tarball and Debian and RPM packages
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          mkdir -p dist/proxyproxy/usr/bin dist/proxyproxy/usr/share/applications dist/proxyproxy/usr/share/pixmaps
          cp target/x86_64-unknown-linux-gnu/release/proxyproxy dist/proxyproxy/usr/bin/
          cp assets/icon.png dist/proxyproxy/usr/share/pixmaps/proxyproxy.png
          cat > dist/proxyproxy/usr/share/applications/proxyproxy.desktop <<'EOF'
          [Desktop Entry]
          Name=proxyproxy
          Comment=HTTP(S) debugging proxy
          Exec=proxyproxy
          Icon=proxyproxy
          Terminal=false
          Type=Application
          Categories=Development;Network;
          EOF

          tar -C dist/proxyproxy -czf dist/proxyproxy-linux-x86_64.tar.gz usr

          mkdir -p dist/deb/DEBIAN dist/deb/usr/bin dist/deb/usr/share/applications dist/deb/usr/share/pixmaps
          cp target/x86_64-unknown-linux-gnu/release/proxyproxy dist/deb/usr/bin/
          cp assets/icon.png dist/deb/usr/share/pixmaps/proxyproxy.png
          cp dist/proxyproxy/usr/share/applications/proxyproxy.desktop dist/deb/usr/share/applications/
          cat > dist/deb/DEBIAN/control <<EOF
          Package: proxyproxy
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Nicholas Lim <${{ github.repository_owner }}@users.noreply.github.com>
          Description: HTTP(S) debugging proxy
          EOF
          dpkg-deb --build dist/deb dist/proxyproxy-linux-amd64.deb

          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > rpmbuild/SPECS/proxyproxy.spec <<EOF
          Name: proxyproxy
          Version: ${VERSION}
          Release: 1%{?dist}
          Summary: HTTP(S) debugging proxy
          License: MIT
          BuildArch: x86_64

          %description
          A desktop HTTP(S) debugging proxy written in Rust.

          %install
          install -Dm755 %{_sourcedir}/proxyproxy %{buildroot}/usr/bin/proxyproxy
          install -Dm644 %{_sourcedir}/proxyproxy.desktop %{buildroot}/usr/share/applications/proxyproxy.desktop
          install -Dm644 %{_sourcedir}/proxyproxy.png %{buildroot}/usr/share/pixmaps/proxyproxy.png

          %files
          /usr/bin/proxyproxy
          /usr/share/applications/proxyproxy.desktop
          /usr/share/pixmaps/proxyproxy.png
          EOF
          cp target/x86_64-unknown-linux-gnu/release/proxyproxy rpmbuild/SOURCES/
          cp dist/proxyproxy/usr/share/applications/proxyproxy.desktop rpmbuild/SOURCES/
          cp assets/icon.png rpmbuild/SOURCES/proxyproxy.png
          rpmbuild --define "_topdir ${PWD}/rpmbuild" -bb rpmbuild/SPECS/proxyproxy.spec
          find rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/proxyproxy-linux-x86_64.rpm \;

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux
          path: |
            dist/proxyproxy-linux-x86_64.tar.gz
            dist/proxyproxy-linux-amd64.deb
            dist/proxyproxy-linux-x86_64.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Find changelog range
        id: range
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' --exclude "$RELEASE_TAG" "$RELEASE_TAG^" 2>/dev/null || true)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "range=${PREV:+$PREV..}$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4.9.1
        with:
          config: cliff.toml
          args: ${{ steps.range.outputs.range }} --tag ${{ env.RELEASE_TAG }} --strip all
        env:
          OUTPUT: CHANGES.md

      - name: Write release notes
        env:
          PREV: ${{ steps.range.outputs.prev }}
        run: |
          {
            cat CHANGES.md
            if [ -n "$PREV" ]; then
              echo
              echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/$PREV...$RELEASE_TAG"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
          if-no-artifact-found: ignore

      - name: Publish
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: proxyproxy ${{ env.RELEASE_TAG }}
          draft: true
          body_path: RELEASE_NOTES.md
          files: dist/*
